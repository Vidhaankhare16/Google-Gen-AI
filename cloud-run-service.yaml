# cloud-run-service.yaml — Cloud Run service definition for Legal EASE
#
# Before applying, replace placeholders:
#   PROJECT_ID → your GCP project ID
#   REGION     → e.g. us-central1
#
# Apply with:
#   gcloud run services replace cloud-run-service.yaml --region=REGION

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: legal-ease
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scaling
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # Second-generation execution environment (better cold-start)
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 50
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/legal-ease/legal-ease:latest
          ports:
            - containerPort: 8080
          env:
            - name: FLASK_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: MAX_FILE_SIZE
              value: "10485760"
            - name: SESSION_TIMEOUT
              value: "3600"
            # GEMINI_API_KEY injected from Secret Manager at runtime
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
          resources:
            limits:
              memory: 2Gi
              cpu: 1000m
            requests:
              memory: 512Mi
              cpu: 250m
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
  traffic:
    - percent: 100
      latestRevision: true
