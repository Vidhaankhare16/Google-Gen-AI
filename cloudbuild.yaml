# cloudbuild.yaml — CI/CD pipeline for Legal EASE
# Triggered automatically on push to main branch (configure in Cloud Build console)
#
# Required substitutions (set in trigger config):
#   _REGION       : e.g. us-central1
#   _SERVICE_NAME : legal-ease

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: legal-ease
  _REPO_NAME: legal-ease

steps:
  # 1. Build Docker image
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest
      - .

  # 2. Push versioned tag
  - name: gcr.io/cloud-builders/docker
    id: push-versioned
    waitFor: [build]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID

  # 3. Push latest tag
  - name: gcr.io/cloud-builders/docker
    id: push-latest
    waitFor: [build]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest

  # 4. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push-versioned]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 2Gi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --concurrency
      - "50"
      - --min-instances
      - "0"
      - --max-instances
      - "10"
      - --set-secrets
      - GEMINI_API_KEY=gemini-api-key:latest
      - --set-env-vars
      - FLASK_ENV=production,MAX_FILE_SIZE=10485760,SESSION_TIMEOUT=3600,PORT=8080
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: "100"
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
